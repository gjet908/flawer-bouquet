<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers For You</title>

<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial;
}

h1{
position:absolute;
top:40px;
color:white;
opacity:0;
animation:show 2s forwards 4s;
}

.flower{
font-size:0px;
position:absolute;
animation:bloom 2s forwards;
}

.f1{left:45%;top:45%;animation-delay:0s;}
.f2{left:50%;top:38%;animation-delay:0.5s;}
.f3{left:55%;top:45%;animation-delay:1s;}
.f4{left:48%;top:52%;animation-delay:1.5s;}
.f5{left:52%;top:52%;animation-delay:2s;}

@keyframes bloom{
to{
font-size:70px;
}
}

@keyframes show{
to{
opacity:1;
}
}
</style>

</head>

<body>

<h1>🌸 For Someone Special ❤️</h1>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌼</div>
<div class="flower f5">🌹</div>

</body>
</html>
