<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flower Bouquet</title>
<style>
body{margin:0;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
.msg{position:absolute;top:40px;color:#fff;font-size:2rem;opacity:0;animation:show 2s forwards 5s}
.f{position:absolute;font-size:0;animation:bloom 2s forwards}
.s{position:absolute;width:4px;height:0;background:#3a5;bottom:0;animation:grow 2s forwards}
@keyframes bloom{to{font-size:70px}}
@keyframes grow{to{height:220px}}
@keyframes show{to{opacity:1}}
</style></head><body>
<div class="msg">For Someone Special ❤️</div>
<div class="s" style="left:49%;animation-delay:0s"></div>
<div class="s" style="left:46%;animation-delay:.5s"></div>
<div class="s" style="left:52%;animation-delay:1s"></div>
<div class="f" style="left:47%;top:35%;animation-delay:2s">🌹</div>
<div class="f" style="left:51%;top:28%;animation-delay:2.5s">🌸</div>
<div class="f" style="left:44%;top:40%;animation-delay:3s">🌷</div>
<div class="f" style="left:54%;top:40%;animation-delay:3.5s">🌼</div>
<div class="f" style="left:49%;top:45%;animation-delay:4s">🌺</div>
<script src="script.js"></script>
</body></html>
